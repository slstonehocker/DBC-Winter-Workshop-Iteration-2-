<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Class Entry</title>
 <!--grabs style info from csss file-->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--loads google sheet-->
     <a
    href="https://docs.google.com/spreadsheets/d/1ho8sNdXEAROHFPHTFDvMFfhpfFSWnmo-MfxPBIhjFlI/edit?gid=0#gid=0"
    target="_blank"
    class="sheet-link">
   Google Sheet
</a>
    
 <!--creates admin password. Should be made more secure-->
  <script>
    const adminPassword = prompt("Enter admin password:");

    if (adminPassword !== "DBC") {
        alert("Incorrect password.");
        window.location.href = "index.html";
    }
</script>

 
 <!--loads set up for admin page and creates input-->
<div class="classes-box">

    <h1>ADMIN CLASS ENTRY/EDIT PORTAL</h1>
    
    <p class="subtitle">
    This information will be used to sign up for classes. Please make sure it is correct. </p>

    <h2>Add New Class</h2>

    <label for="adminBranch">Branch</label>
    <input type="text" id="adminBranch" placeholder="Ex: Denver">

    <label for="adminClass">Class Name</label>
    <input type="text" id="adminClass" placeholder="Ex: Lighting Design">

    <label for="adminDate">Date</label>
    <input type="text" id="adminDate" placeholder="MM/DD/YYYY">

    <label for="adminTime">Time</label>
    <input type="text" id="adminTime" placeholder="Ex: 9-11 AM">

    <label for="adminDescription">Description</label>
    <textarea id="adminDescription" placeholder="Enter class description"></textarea>
    
     <label for="adminTeacher">Instructor</label>
    <input type="text" id="adminTeacher" placeholder="Who is teaching the class?">
    
    <label for="adminCapacity">Seat Capacity</label>
    <input type="number" id="adminCapacity" placeholder="Ex: 20">
    
     <label for="adminLunch">Is lunch provided?</label>
    <input type="text" id="adminLunch" placeholder="Yes/No">

    
     <label for="adminAddress">Address</label>
    <input type="text" id="adminAddress" placeholder="123 Main St, Denver, CO">


    <button type="button" onclick="addClass()">Add Class</button>

    <hr>

 <hr>
    <h2>Edit or Delete Existing Class</h2>

   <label for="existingClass">
    Select Existing Class
</label>

<select id="existingClass" onchange="loadClassForEditing()"><option value="">Select Existing Class</option></select>

  <button type="button" onclick="updateClass()">
    Update Selected Class
</button>

    <button type="button" onclick="deleteClass()">Delete Selected Class</button>

<button type="button" onclick="downloadRoster()">Download Roster CSV</button>
        
        
      
    
 <h2>Remove Someone From Selected Class</h2>

<label for="registrationToRemove">Select Registration</label>

<select id="registrationToRemove">
    <option value="">Select a class first</option>
</select>

<button type="button" onclick="removeRegistration()">
    Remove Selected Registration
</button>


    <hr>

    <h2>Registrations</h2>

    <label for="registrationsSheetSelect">View</label>
    <select id="registrationsSheetSelect" onchange="loadSheetTable(this.value)">
        <option value="Master Registrations">Master Registrations</option>
    </select>

    <div id="registrationsTableWrapper" class="table-wrapper">
        <p>Loading registrations...</p>
    </div>

    <button type="button" class="small-button" onclick="exportSheetToExcel()">Export to Excel</button>

</div>

 <!--loads info into script page and updates google sheet with class info-->
<script>
    const script = document.createElement("script");
    script.src = "script.js?v=" + new Date().getTime();
    document.body.appendChild(script);
</script>
        
</body>
</html>
