<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Registration</title>
    <!--calls style sheet-->
    <link rel="stylesheet" href="style.css">
</head>

<body>

 <!--Registration page setup-->
<div class="page-header">
  <h1>
  Winter Workshop Registrat<a href="admin.html" class="hidden-admin-link">i</a>on
</h1>
    <p class="subtitle">
        Select a branch below to view classes and register.
    </p>
</div>
    
  <div class="search-box">
    <select id="branchFilter" onchange="filterByBranch()">
        <option value="">All Branches</option>
    </select>
</div>

<div id="classCatalog" class="class-catalog">
    <p>Loading classes...</p>
</div>

    <!--creates popup where users fill in class information and save registration-->
<div id="registrationModal" class="modal">
    <div class="modal-content">

        <button type="button" class="close-button" onclick="closeRegistrationModal()">
            &times;
        </button>

        <h2 id="modalClassTitle"></h2>  

        <div id="modalClassDetails" class="modal-class-details"></div>

        <hr>

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Full Name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email">

        <label for="confirmEmail">Confirm Email</label>
        <input type="email" id="confirmEmail" placeholder="Re-enter Email">
   
    <!--max number of spots to register at once: 4-->
        <label for="spotsRequested">Number of Spots</label>
            <select id="spotsRequested">
                <option value="1">1 spot</option>
                <option value="2">2 spots</option>
                <option value="3">3 spots</option>
                <option valule="4">4 spots</option>
                
            </select>
    

        
        <!--adds registration to google sheet and saves to google script-->
        <button type="button" onclick="registerEmployee()">
            Submit Registration
        </button>

    </div>
</div>
    

   <!--Saves updated info into scripts -->
<script>
    const script = document.createElement("script");
    script.src = "script.js?v=" + new Date().getTime();
    document.body.appendChild(script);
</script>

</body>
</html>
