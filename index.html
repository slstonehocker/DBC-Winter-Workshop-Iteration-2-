<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <a href="admin.html" class="admin-link">
    Admin Login
</a>
    
<div class="page-header">
    <h1>Winter Workshop Registration</h1>
    <p class="subtitle">
        Select a class below to view details and register.
    </p>
</div>
    
    <div class="search-box">
    <input
        type="text"
        id="classSearch"
        placeholder="Search by branch"
        oninput="searchClasses()"
    >
</div>

<div id="classCatalog" class="class-catalog">
    <p>Loading classes...</p>
</div>

<div id="registrationModal" class="modal">
    <div class="modal-content">

        <button type="button" class="close-button" onclick="closeRegistrationModal()">
            &times;
        </button>

        <h2 id="modalClassTitle"></h2>

        <div id="modalClassDetails" class="modal-class-details"></div>

        <hr>

        <label for="name">Employee Name</label>
        <input type="text" id="name" placeholder="Full Name">

        <label for="email">Employee Email</label>
        <input type="email" id="email" placeholder="Email">

        <label for="confirmEmail">Confirm Email</label>
        <input type="email" id="confirmEmail" placeholder="Re-enter Email">

        <button type="button" onclick="registerEmployee()">
            Submit Registration
        </button>

    </div>
</div>

<script>
    const script = document.createElement("script");
    script.src = "script.js?v=" + new Date().getTime();
    document.body.appendChild(script);
</script>

</body>
</html>
